<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>YOUNICO PHOTO PLAN</title>

  <!-- 共通CSS -->
  <link rel="stylesheet" href="style.css">
</head>


<body class="home-page">


  <!-- ========================================
       TOP VISUAL
       一番上のメイン画像

       ★あとで撮影写真に変更します
       画像：
       images/top/main.jpg
  ========================================= -->
<section class="home-visual">

  <img
    src="./images/top/top-main.jpg"
    alt="YOUNICO"
    class="home-visual-img"
  >

</section>

  <!-- ========================================
       PHOTO PLAN
  ========================================= -->

  <main class="home-plan">


    <!-- タイトル -->

    <div class="home-plan-heading">

      <p class="home-plan-small">
        PHOTO PLAN
      </p>

      <h1>
        PLEASE FIND YOUR<br class="sp-only">
        FAVORITE PLAN
      </h1>

      <span class="heading-line"></span>

    </div>



    <!-- ========================================
         PLAN SELECT

         01 BRIDAL
         02 SHICHI-GO-SAN
         03 COMING SOON
    ========================================= -->

    <div class="home-plan-grid">


      <!-- ==========================
           01 YOUNICO
           ★画像は後から変更
      =========================== -->

      <a
        href="#"
        class="home-plan-item"
      >

        <div class="home-plan-image">

          <div class="image-placeholder">
            <span>YOUNICO</span>
          </div>

        </div>

        <p class="home-plan-name">
          YOUNICO
        </p>

      </a>



      <!-- ==========================
           02 SHICHI-GO-SAN
           七五三ページへ移動
      =========================== -->

      <a
        href="shichigosan.html"
        class="home-plan-item"
      >

        <div class="home-plan-image">

          <div class="image-placeholder">
            <span>SHICHI-GO-SAN</span>
          </div>

        </div>

        <p class="home-plan-name">
          SHICHI-GO-SAN
        </p>

      </a>



      <!-- ==========================
           03 COMING SOON

           現在はクリックできません
      =========================== -->

      <div class="home-plan-item coming-soon">

        <div class="home-plan-image">

          <div class="image-placeholder">
            <span>COMING SOON</span>
          </div>

        </div>

        <p class="home-plan-name">
          COMING SOON
        </p>

      </div>


    </div>

  </main>



  <!-- JS -->
  <script src="script.js"></script>


</body>

</html>
